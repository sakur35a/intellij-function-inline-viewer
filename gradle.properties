pluginGroup = com.github.sakur35a.functioninlineviewer

# 지원하는 최소 버전: IntelliJ IDEA 2026.1 (build 261). 이 버전으로 컴파일한다.
platformVersion = 2026.1
pluginSinceBuild = 261
# verifyPlugin 이 최소 버전과 함께 검사할 정식 버전들(쉼표로 구분). 최소 버전과 다음 버전 EAP 사이의 릴리스를 적는다.
pluginVerifyVersions = 2026.2
# verifyPlugin 이 함께 검사할 다음 버전 EAP 의 빌드 번호(브랜치). 새 메이저 EAP 가 시작되면 올린다.
pluginVerifyEapBuild = 263

kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
# 테스트 컴파일이 main API 변경을 입력 변화로 감지하지 못해, 캐시가 옛 API 로 컴파일된 테스트 클래스를 복원했다(build.gradle.kts 의 compileTestKotlin 참고).
org.gradle.caching = false
