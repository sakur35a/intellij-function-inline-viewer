# vX.Y.Z 태그가 push 되면 테스트와 Plugin Verifier 를 통과한 뒤 JetBrains Marketplace 에 업로드한다.
# 태그는 ./gradlew release 로 만든다(README 참고).
#
# 필요한 저장소 Secrets:
#   PUBLISH_TOKEN          Marketplace 토큰(필수)
#   CERTIFICATE_CHAIN      플러그인 서명 인증서 체인(chain.crt 를 Base64 로), 선택
#   PRIVATE_KEY            플러그인 서명 개인 키(private_encrypted.pem 을 Base64 로), 선택
#   PRIVATE_KEY_PASSWORD   개인 키 암호, 선택
# 서명 Secrets 가 없으면 서명하지 않은 zip 을 올린다.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 버전(git-semver-plugin)과 change-notes 가 태그와 커밋 기록에서 계산되므로 전체 기록이 필요하다.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Check that the version matches the tag
        run: |
          version=$(./gradlew printVersion -q --rerun-tasks --no-configuration-cache | tail -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Computed version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Test and verify
        run: ./gradlew test verifyPlugin

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # 릴리스 커밋 본문(./gradlew release 가 넣은 변경 목록)을 릴리스 노트로 쓰고, Marketplace 에 올린 zip 을 첨부한다.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/distributions/*.zip \
            --title "$GITHUB_REF_NAME" --notes "$(git log -1 --format=%b "$GITHUB_REF_NAME")"
